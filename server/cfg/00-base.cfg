# ─────────────────────────────────────────────────────────────────────────────
#  00-base.cfg — hálózat, identitás, OneSync
#  Titok NEM kerülhet ebbe a fájlba: ez verziókövetett.
# ─────────────────────────────────────────────────────────────────────────────

# ── Hálózati végpontok ───────────────────────────────────────────────────────
# Megjegyzés: FiveM for GTAV Enhanced esetén csak EGY endpoint adható meg
# típusonként (a Legacy több endpointot is elfogad).
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ── OneSync ──────────────────────────────────────────────────────────────────
# 32 slot felett kötelező, 64 felett csak "on" jó. Az Infinity alapból aktív,
# és csak induláskor állítható.
set onesync on
set onesync_enableInfinity true

# A slotszám a Cfx Portal előfizetéshez kötött (48 felett Element Club).
# A NOVA RP célja 2048; a ténylegesen engedélyezett érték mért adat alapján
# emelkedik — lásd docs/00-research/scale-analysis.md
sv_maxclients 48

# NPC-populáció. Nagy CCU-nál mérés alapján hangolandó (Phase 26-27).
set onesync_population true

# ── Szerver-identitás ────────────────────────────────────────────────────────
# A branding SEHOL nincs a kódba égetve — a szkriptek ezeket a convarokat
# olvassák (lásd docs/01-architecture/configuration.md 4.).
set nova:environment "development"
set nova:server:name "NOVA RP"
set nova:server:shortName "NOVA"

# A szerverböngészőben megjelenő adatok.
sv_hostname "NOVA RP"
sets sv_projectName "NOVA RP"
sets sv_projectDesc "Magyar roleplay szerver"
set gametype "Roleplay"
set mapname "Los Santos"
set locale "hu-HU"

# Ikon: 96x96 PNG a server-data mappában.
# load_server_icon nova.png

# ── Naplózás ─────────────────────────────────────────────────────────────────
# A játékos-IP ne kerüljön a publikus reportokba.
set sv_endpointPrivacy true
