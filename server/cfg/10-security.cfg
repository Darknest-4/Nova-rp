# ─────────────────────────────────────────────────────────────────────────────
#  10-security.cfg — kötelező biztonsági beállítások
#
#  Minden sor mellett ott az indoklás. Beállítást indoklás nélkül ne vegyél fel,
#  és meglévőt ne lazíts a docs/01-architecture/security.md frissítése nélkül.
#
#  A nova_bootstrap induláskor ELLENŐRZI a csillaggal jelölteket, és hibát ír,
#  ha nem a dokumentált értéken állnak.
# ─────────────────────────────────────────────────────────────────────────────

# ── Kliens-integritás ────────────────────────────────────────────────────────

# * ScriptHook engedélyezése azonnali sebezhetőség. A hivatalos dokumentáció is
#   kifejezetten ellenjavallja. Alapértelmezés szerint is 0, de kimondjuk.
sv_scriptHookAllowed 0

# Módosított kliensfájlok blokkolása.
#   1 = minden módosítás blokkolva az audio és az ismert grafikai modok kivételével
#   2 = minden módosítás blokkolva
# FiveM for GTAV Enhanced esetén a pure mode mindig aktív, nem kapcsolható ki.
set sv_pureLevel 2

# ── Entitás-kontroll ─────────────────────────────────────────────────────────

# * A kliens ne hozhasson létre entitást. A NOVA minden entitást szerveroldalon
#   hoz létre a nova_world modulon keresztül (entitás-költségvetéssel).
#   Enhanced-en elérhető a szigorúbb "full" mód is (dummy objektumok tiltása) —
#   a váltás az ADR-0001 felülvizsgálatakor esedékes.
set sv_entityLockdown "strict"

# * A kliens ne módosíthasson replikált entity/player state baget.
#   Replikált convar (setr), a szerververzió 12739 óta létezik.
setr sv_stateBagStrictMode "true"

# ── Ismert visszaélési vektorok ──────────────────────────────────────────────

# NETWORK_PLAY_SOUND_EVENT routing tiltása (hangspam / crash vektor).
set sv_enableNetworkedSounds "false"

# REQUEST_PHONE_EXPLOSION_EVENT — alapból is tiltott, kimondjuk.
set sv_enableNetworkedPhoneExplosions "false"

# SCRIPT_ENTITY_STATE_CHANGE_EVENT routing tiltása.
# FIGYELEM: egyes third-party resource-ok támaszkodnak rá. A NOVA nem — ha egy
# jövőbeli függőség mégis igényelné, azt a függőség-adatlapon kell indokolni.
set sv_enableNetworkedScriptEntityStates "false"

# ── Identitás-ellenőrzés ─────────────────────────────────────────────────────
# A trust/variance szigorítása spoofing ellen. A pontos értékek a Phase 23
# biztonsági hangolásában, MÉRÉS alapján rögzülnek — az alábbi csak kiindulás,
# és túl szigorúra állítva jogos játékosokat is kizárhat.
# set sv_authMinTrust 4
# set sv_authMaxVariance 1

# ── REQUEST_CONTROL_EVENT szűrés ─────────────────────────────────────────────
# Entity-lopás elleni védelem. A megfelelő mód kiválasztása a Phase 23 tesztje
# után történik — vaktában bekapcsolva jogos játékmenetet is megtörhet.
# set sv_filterRequestControl 4

# ── Rate limiterek (csak FiveM for GTAV Enhanced) ────────────────────────────
# Token bucket. Legacy-n ezek a convarok nem léteznek (a beállításuk hatástalan).
# A platform-szintű limit NEM helyettesíti a nova_net event-szintű limitjét.
# set rateLimiter_netEvent_rate 50
# set rateLimiter_netEvent_burst 200
# set rateLimiter_stateBag_rate 75
# set rateLimiter_stateBag_burst 125
